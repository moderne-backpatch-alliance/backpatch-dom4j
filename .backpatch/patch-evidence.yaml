  - cve: CVE-2020-10683
    upstream_fix_url: https://github.com/advisories/GHSA-hwj3-m3p6-hj38
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2020-10683
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-dom4j/commit/381a022
    basis: adapted
    artifacts:
      - dom4j:dom4j
    note: "New in this release; ported onto 1.6.1; fixed at 1.6.1.1-backpatch-00002 (backpatch-dom4j@381a022). `DocumentHelper.parseText()` no longer reads external DTDs or external entities (CVE-2020-10683): it now parses with the new `SAXReader.createDefault()`, which turns those parser features off. If your app passes `parseText()` XML whose DOCTYPE points at a DTD file or URL, entities declared only in that DTD now come out as empty text and its default attribute values are missing, with no error. Move the declarations into the document's internal subset (`<!DOCTYPE root [ ... ]>`), which `parseText()` still applies, or parse with `new SAXReader()` plus `setEntityResolver(...)` that returns your own copy of the DTD and an empty source for anything else. A plain `new SAXReader()` without such a resolver reads whatever the document points at, which brings back the exposure the fix closes."
