  note: "903 tests at the patch commit, 0 of them skipped by the suite, 0 failed, 0 errors. Left out of the run as accepted exceptions: org.dom4j.io.StaxTest#testEncoding (the JDK's built-in StAX parser wins over the reference implementation the test was written for; upstream disabled this test in a9da11b); org.dom4j.rule.RuleTest#testOrder (Rule.compareTo rounds the priority difference, a defect JDK 7+'s sort exposes; upstream fixed it in affce67 (2.0.0), not ported). Main classes compiled with Zulu 6u42's javac at the build's source and target; test classes compiled and run on Zulu 8. Ant runs no method-level exclusion, so StaxTest and RuleTest are left out as classes, which also drops RuleTest's passing testDocument and testTextMatchesCDATA."
